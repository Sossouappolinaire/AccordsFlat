plugins {
    id 'com.android.application'
}

// La signature est fournie par l'environnement ou par les secrets de CI,
// jamais par des mots de passe enregistrés dans ce fichier.
def signingStorePath = System.getenv("ANDROID_KEYSTORE_FILE")
def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def signingConfigured = [signingStorePath, signingStorePassword, signingKeyAlias, signingKeyPassword].every {
    it != null && !it.trim().isEmpty()
}

android {
    namespace 'bj.radio'
    compileSdk 34

    defaultConfig {
        applicationId 'bj.radio'
        minSdk 24
        targetSdk 34
        // À AUGMENTER à chaque nouvelle version (sinon Android refuse de remplacer l'ancienne).
        versionCode 20
        versionName '1.20'
    }

    if (signingConfigured) {
        signingConfigs {
            sossokouame {
                storeFile file(signingStorePath)
                storeType 'PKCS12'
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    } else {
        logger.warn("Signature personnalisée non configurée : l'APK release sera non signé.")
    }

    buildTypes {
        debug {
            if (signingConfigured) signingConfig signingConfigs.sossokouame
        }
        release {
            if (signingConfigured) signingConfig signingConfigs.sossokouame
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        jniLibs { useLegacyPackaging = true }   // Vosk (paroles hors ligne)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // Accords & Musique : paroles hors ligne (Vosk), séparation de pistes (ONNX)
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
