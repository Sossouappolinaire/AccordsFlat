plugins {
    id 'com.android.application'
}

// Signature de l'APK. Deux modes, sans rien à configurer dans GitHub :
//  1) si les secrets GitHub ANDROID_* existent, ils sont utilisés (variables d'environnement) ;
//  2) sinon, on utilise le fichier sossokouame.keystore placé dans le projet (même clé à chaque build,
//     donc chaque version remplace l'ancienne sans désinstaller).
// Ne jamais perdre ni changer sossokouame.keystore.
def envStore = System.getenv("ANDROID_KEYSTORE_FILE")
def envStorePwd = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def envAlias = System.getenv("ANDROID_KEY_ALIAS")
def envKeyPwd = System.getenv("ANDROID_KEY_PASSWORD")
def envConfigured = [envStore, envStorePwd, envAlias, envKeyPwd].every {
    it != null && !it.trim().isEmpty()
}
def localKeystore = file('sossokouame.keystore')
def signingConfigured = envConfigured || localKeystore.exists()
def sigFile = envConfigured ? file(envStore) : localKeystore
def sigStorePwd = envConfigured ? envStorePwd : 'Yy8xyxKijSLTNcPt53uP'
def sigAlias = envConfigured ? envAlias : 'sossokouame'
def sigKeyPwd = envConfigured ? envKeyPwd : 'Yy8xyxKijSLTNcPt53uP'

android {
    namespace 'bj.radio'
    compileSdk 34

    defaultConfig {
        applicationId 'bj.radio'
        minSdk 24
        targetSdk 34
        // À AUGMENTER à chaque nouvelle version (sinon Android refuse de remplacer l'ancienne).
        versionCode 35
        versionName '1.5.5'
    }

    if (signingConfigured) {
        signingConfigs {
            sossokouame {
                storeFile sigFile
                storeType 'PKCS12'
                storePassword sigStorePwd
                keyAlias sigAlias
                keyPassword sigKeyPwd
            }
        }
    } else {
        logger.warn("Aucun keystore trouvé (sossokouame.keystore) : l'APK release sera non signé.")
    }

    buildTypes {
        debug {
            if (signingConfigured) signingConfig signingConfigs.sossokouame
        }
        release {
            if (signingConfigured) signingConfig signingConfigs.sossokouame
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        jniLibs { useLegacyPackaging = true }   // Vosk (paroles hors ligne)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // Accords & Musique : paroles hors ligne (Vosk), séparation de pistes (ONNX)
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
