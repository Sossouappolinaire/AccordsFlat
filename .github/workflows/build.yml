name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le projet Android
        run: |
          mkdir -p app/src/main/java/bj/radio
          mv ./*.java app/src/main/java/bj/radio/
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv app.gradle app/build.gradle
          if [ -f ic_launcher.png ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable-xxxhdpi app/src/main/res/values
            mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            mv ic_launcher_foreground.png app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png
            mv ic_launcher_adaptive.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            mv ic_launcher_colors.xml app/src/main/res/values/ic_launcher_colors.xml
          fi
          if [ -f kouame_playbox_hero.jpg ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            mv kouame_playbox_hero.jpg app/src/main/res/drawable-nodpi/kouame_playbox_hero.jpg
          fi
      - name: Images du jeu GTA Mini
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          mv gta_*.png app/src/main/res/drawable-nodpi/
      - name: Ressources Accords & Musique
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/values
          mv accords_logo_bg.xml app/src/main/res/drawable/accords_logo_bg.xml
          mv accords_logo_fg.xml app/src/main/res/drawable/accords_logo_fg.xml
          mv accords_values.xml app/src/main/res/values/accords_values.xml
      - name: Préparer la signature (secrets GitHub si présents, sinon keystore du dépôt)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
            && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/sossokouame.keystore
            echo "Signature : secrets GitHub"
            {
              echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/app/sossokouame.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ -f sossokouame.keystore ]; then
            mv sossokouame.keystore app/sossokouame.keystore
            echo "Signature : keystore du dépôt"
          else
            echo "::warning::Aucun keystore : l'APK ne sera pas signé."
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: 'app/build/outputs/apk/release/*.apk'
          if-no-files-found: error
